[package]
name = "os"
version = "0.1.0"
authors = ["Yifan Wu <shinbokuow@163.com>"]
edition = "2021"

[features]
default = []
# Keep lock dependency checking and scheduler-stall snapshots available in an
# optimized kernel. This feature adds diagnostics only and does not change the
# userspace ABI or test programs.
smp-diagnostics = []
# The official QEMU command does not enable the RISC-V V extension. Keep
# vector context switching opt-in for local tests that explicitly add
# `-cpu max,v=true,vlen=128`.
riscv-vector = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
polyhal = { version = "0.3.2", features = ["trap"] }
polyhal-boot = { version = "0.3.2" }
polyhal-trap = { version = "0.3.2" }
lazyinit = "0.2.1"

lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
buddy_system_allocator = "0.11.0"
bitflags = "1.2.1"
xmas-elf = "0.7.0"
virtio-drivers = "0.7.1"
log = "0.4"
fdt = "0.1.5"
smoltcp = { version = "0.11", default-features = false, features = [
    "alloc",
    "log",
    "medium-ip",
    "medium-ethernet",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "proto-ipv4",
    "proto-dhcpv4",
] }
lwext4_rust = { path = "../lwext4_rust", default-features = false }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
loongArch64 = "0.2.6"

[target.'cfg(target_arch = "riscv64")'.dependencies]
# Kept target-specific so the existing LoongArch single-core build does not
# acquire an SBI or RISC-V CSR dependency.
riscv = "0.13.0"
sbi-rt = "0.0.2"

[profile.release]
debug = true
